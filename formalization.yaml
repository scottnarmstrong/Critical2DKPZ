related_formalizations: []

status:
  scope: >-
    Formalized and proved: the 26 statements listed in docs/main-results.md, namely the
    ten main results of the paper (Theorem A, Theorem 1.2, the comparison
    principle, Theorem 1.4(i) and (ii), Proposition 1.5, Theorem 1.6,
    Proposition 1.8, Proposition 3.8 and the centring asymptotic (1.16));
    twelve key intermediate results, among them Ehrhard's inequality, Gaussian
    convexity (Theorem 3.1), the local limit theorem for the planar simple
    random walk, the critical-window second moment, the block moment bounds
    (Lemma B.2), the log-normality of small-scale SHF averages (Theorem 8.1),
    the symmetries, time reversal and continuity of the SHF, and the joint
    convergence of the regularized fields (Theorem 5.1); and Theorems A–D of
    Scott Armstrong's note: strict skewness, response to the initial condition,
    Brownian motion across scales and the finite-dimensional GFF tangent.
    All statements concern the paper's model: Gaussian disorder, the planar
    simple random walk and the paper's critical tuning; no universality over
    the disorder is claimed.
    Results of other papers are formalized in the form the proofs use, as
    special cases or adaptations listed in docs/inputs/.
  sorry_count: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
        - "claude-sonnet-5-5"
        - "gpt-6.1-sol"
        - "gpt-6-luna"
      framework: >-
        AI-assisted Lean proof development in Claude Code (Anthropic) and
        Codex (OpenAI), using the models listed above.
      tool_setup: >-
        Lean and Mathlib v4.35.0-rc2, built with Lake; the main statements were
        separately compared with the paper, including their hypotheses and
        axiom dependencies.
      hardware: "one 16-CPU Linux machine"
  notes: >-
    Lean code was written with the listed AI models under the author's
    supervision. The Lean kernel checks the formal proofs; the proof libraries
    contain no sorry and no custom axiom.

review:
  status: "author-approved-statements"
  reviewers:
    - "Scott Armstrong"
  notes: >-
    Scott Armstrong approved the main statements. Separate agent reviews checked
    the statements against the paper and audited the proofs of the main
    statements. The authors of the paper have not reviewed the formalization.

