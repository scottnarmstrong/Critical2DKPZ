version: "v0.4"

project:
  name: "The Critical 2D KPZ Process"
  description: >-
    A Lean 4 formalization of "The Critical 2D KPZ Process" by Berger,
    Caravenna, Clark, Dunlap, Gu, Liu, Nakajima, Sun, Tsai, Xie and Zygouras
    (arXiv:2610.31614, version 1), together with selected inputs and adaptations
    in the form these proofs need. For directed polymers on Z^2 in a Gaussian
    environment at critical disorder, it proves the existence of a critical 2D
    stochastic heat flow, defined as the joint limit in law of the rescaled
    partition functions (Theorem A). The centred log-partition function
    converges in law, in the local negative Sobolev spaces H^{-a}_loc and
    jointly in finitely many times and initial data, to the critical 2D KPZ
    process (Theorem 1.2). The process satisfies the comparison principle in
    the initial data. For flat initial data, its averages at scale epsilon,
    divided by sqrt(log log(1/epsilon)), converge in law to a centred Gaussian
    (Theorem 1.4(i)); it has a radial covariance kernel equivalent to
    log log(1/|z|) at the diagonal (Theorem 1.4(ii)), is not a signed measure
    (Proposition 1.5), is not Gaussian (Theorem 1.6), is invariant under
    translations and rotations and covariant under scaling (Proposition 1.8),
    and its pairing with each nonnegative test function has a law of Ehrhard
    type (Proposition 3.8). It also proves strict skewness, twice differentiable
    response to initial data, Brownian motion across scales and the
    finite-dimensional GFF tangent (Theorems A–D of Scott Armstrong’s note).
    The parameter theta is fixed. Built on Mathlib.
    All proofs use only Lean's standard axioms.
  authors:
    - "Scott Armstrong"
  responsible_maintainers:
    - "Scott Armstrong"
  license: "Apache-2.0"
  funding:
    - "Scott Armstrong was supported by the European Research Council (ERC) under the European Union's Horizon Europe research and innovation programme, grant agreement No. 101200828."

